name: 品質検証

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      local_vm:
        description: 専用の実Macでlocalhost VM検証を実行する
        type: boolean
        default: false
      external_url:
        description: 本人限定を確認済みのQuick Tunnel URL（停止の独立観測だけを実行）
        type: string
        default: ''
      external_gate_tag:
        description: 鍵方式の入口が公開するSHA256識別子（秘密鍵・Cookieは入力しない）
        type: string
        default: ''
      witness_seconds:
        description: 外部観測の時間（30〜600秒）
        type: number
        default: 240
      witness_phase:
        description: 停止への遷移、または停止後の状態だけを外部確認する
        type: choice
        options: [transition, stopped]
        default: transition

permissions:
  contents: read

jobs:
  guest:
    if: github.event_name != 'workflow_dispatch' || inputs.external_url == ''
    name: ゲストの競合検出
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: guest/go.mod
          cache: false
      - run: go test -race -count=1 ./...
        working-directory: guest
      - name: 通信VMのLinux ARM64ビルド
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./...
        working-directory: egress

  dashboard:
    if: github.event_name != 'workflow_dispatch' || inputs.external_url == ''
    name: Playwrightの画面検証
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: 自己ペネの応答表示・中止・完了後の復帰
        run: node tests/live_dashboard.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dashboard-browser
          path: |
            test-results/dashboard-browser
            test-results/live-dashboard
          retention-days: 7

  swift:
    if: github.event_name != 'workflow_dispatch' || inputs.external_url == ''
    name: VM非依存のSwiftと導入復旧
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: guest/go.mod
          cache: false
      - run: bash tests/unit.sh
      - run: python3 -m unittest discover -s tests -p test_external_witness.py
      - run: bash tests/egress.sh
      - name: 製品Swiftの型検査
        run: swiftc -swift-version 5 -typecheck -framework Cocoa -framework Virtualization -framework Network -framework WebKit Sources/HoneyObs/*.swift
      - name: 開発署名と同梱資産の検査
        run: |
          bash scripts/build.sh
          python3 scripts/check_bundle.py

  local-vm:
    name: 実Macのlocalhost VMゲート
    if: github.event_name == 'workflow_dispatch' && inputs.local_vm && inputs.external_url == ''
    needs: [guest, dashboard, swift]
    runs-on: [self-hosted, macOS, ARM64, honeyobs-vm]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: guest/go.mod
          cache: false
      - run: bash scripts/local_vm_gate.sh

  external-witness:
    name: 本人限定トンネルの独立外部観測
    if: github.event_name == 'workflow_dispatch' && inputs.external_url != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: 入力境界と停止の判定を検査
        run: python3 -m unittest discover -s tests -p test_external_witness.py
      - name: 外部から本人限定の認証入口を事前確認
        if: inputs.witness_phase != 'stopped'
        env:
          WITNESS_URL: ${{ inputs.external_url }}
          WITNESS_GATE_TAG: ${{ inputs.external_gate_tag }}
        run: python3 tests/external_witness.py --url "$WITNESS_URL" --gate-tag "$WITNESS_GATE_TAG" --baseline-only --output test-results/external-witness/preflight.json
      - name: 未認証の転送とCloudflare 1033を新規・継続接続で観測
        if: inputs.witness_phase != 'stopped'
        env:
          WITNESS_URL: ${{ inputs.external_url }}
          WITNESS_SECONDS: ${{ inputs.witness_seconds }}
          WITNESS_GATE_TAG: ${{ inputs.external_gate_tag }}
        run: python3 tests/external_witness.py --url "$WITNESS_URL" --gate-tag "$WITNESS_GATE_TAG" --seconds "$WITNESS_SECONDS" --output test-results/external-witness/report.json
      - name: 停止後の状態を外部から再確認
        if: inputs.witness_phase == 'stopped'
        env:
          WITNESS_URL: ${{ inputs.external_url }}
          WITNESS_GATE_TAG: ${{ inputs.external_gate_tag }}
        run: python3 tests/external_witness.py --url "$WITNESS_URL" --gate-tag "$WITNESS_GATE_TAG" --stopped-only --output test-results/external-witness/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-witness-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/external-witness/*.json
          retention-days: 1
